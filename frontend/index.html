<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Primary SEO -->
    <title>FancyFashion | Luxury & Modern Men's Fashion Store</title>

    <meta
      name="description"
      content="Discover the art of refined style with FancyFashion. Explore bespoke shirts, luxury denim, tailored trousers, blazers, and premium menswear."
    />

    <meta
      name="keywords"
      content="FancyFashion, luxury mens wear, modern fashion, premium shirts, designer clothing, bespoke suits, streetwear, men apparel online"
    />

    <meta name="author" content="FancyFashion" />

    <!-- Search Engine -->
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://fancyfashion.shop/" />

    <!-- Theme -->
    <meta name="theme-color" content="#0a0a0f" />

    <!-- Google Site Name -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "FancyFashion",
        "alternateName": "FancyFashion Men's Wear",
        "url": "https://fancyfashion.shop/"
      }
    </script>

    <!-- Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "FancyFashion",
        "url": "https://fancyfashion.shop/",
        "logo": "https://fancyfashion.shop/favicon.png"
      }
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="FancyFashion | Luxury & Modern Men's Fashion Store"
    />
    <meta
      property="og:description"
      content="Discover refined contemporary style with FancyFashion. Tailored blazers, luxury shirts, casual wear, and footwear for the modern man."
    />
    <meta property="og:url" content="https://fancyfashion.shop/" />
    <meta property="og:site_name" content="FancyFashion" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="FancyFashion | Luxury & Modern Men's Fashion Store"
    />
    <meta
      name="twitter:description"
      content="Discover refined contemporary style with FancyFashion. Shop bespoke menswear collections today."
    />

    <!-- Mobile Browser -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-title"
      content="FancyFashion"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
